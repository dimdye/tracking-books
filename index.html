<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ex Libris</title>
<meta name="description" content="My private reading log.">
<meta name="theme-color" content="#150D10">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ex Libris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar; dark Books & Boba family, re-inked in oxblood. */
:root {
  color-scheme: dark;
  --bg: #150D10;
  --surface: #20131A;
  --surface2: #2A1820;
  --line: #3A2229;
  --track: #3E242C;
  --text: #F3E7EA;
  --soft: #A99199;
  --paper: #FCF3F4;
  --accent: #B0263D;
  --accent-hi: #EA7C8E;
  --accent-deep: #7C1427;
  --good: #7FCFA3;
  --warn: #EBB062;
  --err: #FFA08F;
  --card-paper: #F2E5DD;
  --card-rule: #DCC5BB;
  --card-ink: #A11F33;
  --card-text: #5A3236;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
  --nav-h: 66px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: #150D10; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.no-scroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p, figure, blockquote { margin: 0; }
::selection { background: #B0263D66; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .8s linear infinite; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

.main { max-width: 640px; margin: 0 auto; padding-block: 20px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px)); }
.page { display: flex; flex-direction: column; gap: 16px; }

/* ---------- utility ---------- */
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-xs { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; gap: 8px; align-items: center; }
.row-center { display: flex; gap: 6px; align-items: center; }
.between { justify-content: space-between; }
.end { justify-content: flex-end; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.minw0 { min-width: 0; }
.center { text-align: center; align-items: center; justify-content: center; }
.right { text-align: right; }
.pad-y { padding-block: 18px; }
.sm-gap { gap: 6px; }
.one-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.two-line { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.muted { color: var(--soft); }
.sm { font-size: 13px; }
.xs { font-size: 11.5px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.accent-t { color: var(--accent-hi); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); display: block; }
.hint { font-size: 12px; color: var(--soft); }
.note { font-size: 12.5px; color: var(--text); background: var(--surface2); border: 1px solid var(--line); padding: 8px 11px; border-radius: 10px; }
.note-err { font-size: 13px; color: var(--err); background: #FF6B5E14; border: 1px solid #FF6B5E33; padding: 8px 11px; border-radius: 10px; }
.link { background: none; border: none; padding: 4px 0; color: var(--accent-hi); font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 5px; align-items: center; align-self: center; }
.link.sm { font-size: 12.5px; }
.t-title { font-family: var(--f-display); font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--text); }
.t-title.sm { font-size: 14.5px; }
.h-page { font-family: var(--f-display); font-weight: 600; font-size: 28px; letter-spacing: -.01em; text-wrap: balance; }
.h-sec { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 12px; border: 1px solid transparent; padding: 10px 16px; font-size: 14px; font-weight: 600; min-height: 42px; transition: transform .1s ease, opacity .15s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text); border-color: var(--line); }
.btn-danger { background: transparent; color: var(--err); border-color: #FF6B5E44; }
.btn.sm { min-height: 34px; padding: 6px 11px; font-size: 13px; }
.icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: none; background: var(--surface2); color: var(--text); flex-shrink: 0; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; background: transparent; color: var(--soft); }
.icon-btn.ghosted { background: transparent; border: 1px solid var(--line); }
.input { width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; font-size: 16px; color: var(--text); outline: none; min-height: 44px; }
.input:focus { border-color: var(--accent-hi); }
.input::placeholder { color: #7D6870; }
textarea.input { resize: vertical; line-height: 1.45; }
.input.narrow { width: 96px; flex: none; }
.select { width: auto; flex: none; padding-right: 8px; font-size: 14px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chips.tight { gap: 5px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--soft); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip-on { background: #B0263D2E; border-color: var(--accent); color: var(--paper); }
.chip-n { font-family: var(--f-mono); font-size: 11px; opacity: .7; }
.tag { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--soft); border: 1px solid var(--line); }
.pill { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--soft); white-space: nowrap; }
.pill-accent { background: #B0263D33; color: var(--accent-hi); }

.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px; gap: 2px; }
.seg button { flex: 1; border: none; background: transparent; color: var(--soft); border-radius: 99px; padding: 9px 4px; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .15s; min-width: 0; }
.seg button.on { background: var(--paper); color: var(--accent-deep); }
.seg-sm button { padding: 7px 4px; font-size: 12.5px; }

.bar { height: 7px; background: var(--track); border-radius: 99px; overflow: hidden; flex: 1 1 auto; min-width: 40px; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.bar-thin { height: 5px; }

.ring { position: relative; flex-shrink: 0; }
.ring svg { display: block; }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-num { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1; }
.ring-of { font-size: 11.5px; color: var(--soft); margin-top: 2px; }

/* stars with quarter fills */
.stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.star { position: relative; display: inline-block; width: var(--s); height: var(--s); }
.star-empty { color: var(--track); position: absolute; inset: 0; }
.star-fill { position: absolute; inset: 0 auto 0 0; overflow: hidden; color: var(--accent-hi); }
.star-fill svg { display: block; }
.rating-input { display: flex; flex-direction: column; gap: 6px; }
.rating-top { display: flex; align-items: center; justify-content: space-between; }
.rating-num { font-family: var(--f-display); font-size: 26px; font-weight: 700; color: var(--accent-hi); font-variant-numeric: tabular-nums; }
.rating-input input[type=range] { width: 100%; accent-color: var(--accent); height: 30px; }
.rating-ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; color: var(--soft); padding: 0 4px; }

/* covers */
.cover { display: block; object-fit: cover; border-radius: 5px; box-shadow: 0 3px 10px #00000066, inset 0 0 0 1px #ffffff10; flex-shrink: 0; background: var(--surface2); }
.cover-xs { width: 34px; height: 50px; border-radius: 3px; }
.cover-sm { width: 48px; height: 72px; }
.cover-md { width: 64px; height: 96px; }
.cover-lg { width: 112px; height: 168px; border-radius: 7px; }
.cover-gen { display: flex; flex-direction: column; justify-content: space-between; padding: 7px 6px 6px 9px; overflow: hidden; position: relative; }
.cover-gen::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: #ffffff22; }
.cover-gen-title { font-family: var(--f-display); font-weight: 600; color: #F7E4E7; font-size: 10px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.cover-lg .cover-gen-title { font-size: 15px; -webkit-line-clamp: 5; }
.cover-xs .cover-gen-title, .cover-sm .cover-gen-title { font-size: 8px; }
.cover-xs .cover-gen-title { display: none; }
.cover-gen-author { font-size: 8.5px; color: #F7E4E7AA; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cover-lg .cover-gen-author { font-size: 11px; }

/* sheets */
.sheet-backdrop { position: fixed; inset: 0; background: #0A0507B8; z-index: 60; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: rise .25s cubic-bezier(.2, .9, .3, 1); border: 1px solid var(--line); border-bottom: none; }
.sheet-tall { height: 88vh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.sheet-body { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.sheet-foot { padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); }
.sheet-body:last-child { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

.fuzzy-date { display: flex; gap: 8px; align-items: center; }
.fuzzy-date input { flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px; font-size: 16px; min-height: 44px; }
.fuzzy-date select { width: 82px; background: var(--surface2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 6px; font-size: 16px; min-height: 44px; }
.fuzzy-date select:disabled { opacity: .5; }

.disclose { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface2); }
.disclose summary { cursor: pointer; font-size: 13.5px; font-weight: 600; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.disclose summary::-webkit-details-marker { display: none; }
.disclose summary::after { content: " ›"; color: var(--soft); }
.disclose[open] summary { margin-bottom: 12px; }

/* add */
.add-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.add-tile { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface2); border: 1px dashed #5A3540; color: var(--accent-hi); border-radius: 14px; padding: 14px; }
.add-tile span { display: flex; flex-direction: column; color: var(--text); }
.add-tile strong { font-size: 14px; }
.add-tile small { font-size: 12px; color: var(--soft); }
.add-tile:disabled { opacity: .5; }
.add-preview { display: flex; gap: 14px; align-items: flex-start; }

.log-book { display: flex; gap: 12px; align-items: center; }
.log-input { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.log-big { display: flex; align-items: baseline; gap: 8px; justify-content: center; }
.log-big input { width: 150px; text-align: center; font-family: var(--f-display); font-size: 46px; font-weight: 700; background: transparent; border: none; border-bottom: 2px solid var(--accent); color: var(--text); outline: none; padding: 0; -moz-appearance: textfield; }
.log-big input::-webkit-outer-spin-button, .log-big input::-webkit-inner-spin-button { -webkit-appearance: none; }
.log-big span { font-family: var(--f-mono); color: var(--soft); font-size: 16px; }
.log-delta { font-family: var(--f-mono); font-size: 13px; color: var(--accent-hi); }
.log-delta.neg { color: var(--warn); }

/* home */
.home-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--soft); text-transform: uppercase; }
.brand { font-family: var(--f-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-style: italic; color: var(--paper); }
.goal { display: flex; gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.goal-line { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.pace { font-size: 13px; font-weight: 600; }
.pace-good { color: var(--good); }
.pace-warn { color: var(--warn); }
.goal-empty { display: flex; gap: 14px; align-items: center; text-align: left; background: none; border: none; color: var(--accent-hi); padding: 0; width: 100%; }
.goal-empty span { display: flex; flex-direction: column; gap: 3px; color: var(--text); }
.goal-empty small { color: var(--soft); font-size: 13px; }

.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); display: flex; gap: 4px; align-items: center; }
.tile-val { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile-sub { font-size: 11.5px; color: var(--soft); line-height: 1.3; }

.reading-card { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.reading-main { flex: 1; min-width: 0; display: flex; gap: 13px; text-align: left; background: none; border: none; padding: 13px; align-items: center; }
.log-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 62px; flex-shrink: 0; background: #B0263D22; border: none; border-left: 1px solid var(--line); color: var(--accent-hi); font-size: 12px; font-weight: 700; }
.log-btn:active { background: #B0263D44; }

.card-teaser { display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; background: var(--card-paper); color: var(--card-text); border: none; border-radius: 16px; padding: 14px 16px; }
.card-teaser .label, .card-teaser .muted { color: #8A6A6C; }
.card-teaser strong { font-family: var(--f-display); font-size: 18px; color: var(--card-ink); }
.mini-slots { display: grid; grid-template-columns: repeat(5, 12px); gap: 5px; flex-shrink: 0; }
.mini-slots span { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--card-rule); }
.mini-slots span.on { background: var(--card-ink); border-color: var(--card-ink); transform: rotate(-8deg); }

.row-btn { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; color: var(--accent-hi); font-weight: 600; text-align: left; }
.row-btn span { flex: 1; color: var(--text); }

.shelf-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 16px; }
.shelf-strip::-webkit-scrollbar { display: none; }
.strip-book { display: flex; flex-direction: column; gap: 6px; align-items: center; background: none; border: none; padding: 0; flex-shrink: 0; }

/* library */
.filter-row { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filter-row::-webkit-scrollbar { display: none; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--soft); pointer-events: none; }
.search .input { padding-left: 36px; }
.book-list { display: flex; flex-direction: column; }
.book-row { display: flex; gap: 13px; align-items: center; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line); padding: 12px 2px; }
.book-row:last-child { border-bottom: none; }

/* detail */
.detail-top { display: flex; justify-content: space-between; }
.detail-hero { display: flex; gap: 16px; align-items: flex-start; }
.cover-btn { position: relative; background: none; border: none; padding: 0; flex-shrink: 0; }
.cover-btn-tag { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
.detail-title { font-family: var(--f-display); font-size: 24px; font-weight: 600; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.detail-author { font-size: 15px; color: var(--soft); }
.meta { font-size: 12.5px; color: var(--soft); font-family: var(--f-mono); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.quote { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 4px; }
.quote blockquote { font-family: var(--f-display); font-style: italic; font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote figcaption { display: flex; justify-content: space-between; align-items: center; color: var(--soft); font-size: 12px; }
.log-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
.log-row > :first-child { flex: 1; }
.confirm { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* stats */
.cols { display: flex; gap: 3px; align-items: stretch; padding-top: 16px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; align-items: center; }
.col-track { position: relative; width: 100%; height: var(--h); display: flex; align-items: flex-end; justify-content: center; background: repeating-linear-gradient(to top, transparent 0 calc(var(--h) / 4 - 1px), #ffffff08 calc(var(--h) / 4 - 1px) calc(var(--h) / 4)); }
.col-bar { width: 100%; max-width: 26px; min-height: 0; background: #B0263D99; border-radius: 4px 4px 1px 1px; transition: height .4s ease; }
.col-max .col-bar, .col-now .col-bar { background: var(--accent); }
.col-now .col-lab { color: var(--text); font-weight: 700; }
.col-val { position: absolute; top: -2px; left: 50%; transform: translate(-50%, -100%); font-family: var(--f-mono); font-size: 10.5px; color: var(--accent-hi); white-space: nowrap; }
.col-lab { font-size: 10.5px; color: var(--soft); font-family: var(--f-mono); height: 14px; }
.hbars { display: flex; flex-direction: column; gap: 9px; }
.hbar { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar-lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 9px; background: var(--track); border-radius: 99px; overflow: hidden; }
.hbar-track span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.hbar-val { font-size: 12px; color: var(--soft); text-align: right; min-width: 2.5em; }
.fact { font-size: 15px; }
.fact strong { color: var(--accent-hi); }
.hm-wrap { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; }
.hm-months, .hm-grid { display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); gap: 3px; min-width: 300px; }
.hm-months span { font-size: 9.5px; color: var(--soft); font-family: var(--f-mono); white-space: nowrap; overflow: visible; }
.hm-col { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.hm { display: block; aspect-ratio: 1; border-radius: 2px; max-width: 100%; }
.hm.l0 { background: var(--track); opacity: .55; }
.hm.l1 { background: #6B1A28; }
.hm.l2 { background: #8E2135; }
.hm.l3 { background: #BF3049; }
.hm.l4 { background: #EF7D90; }
.hm.lx { background: transparent; }
.hm-legend { display: flex; gap: 3px; align-items: center; justify-content: flex-end; font-size: 10.5px; color: var(--soft); }
.hm-legend .hm { width: 10px; }
.hm-legend span:first-child { margin-right: 3px; }
.hm-legend span:last-child { margin-left: 3px; }
.list-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; text-align: left; }
.list-line:last-child { border-bottom: none; }
.list-line > span:first-child { display: flex; flex-direction: column; }
.btn-line { background: none; border-left: none; border-right: none; border-top: none; width: 100%; color: var(--text); }
.mini-book { display: flex; gap: 11px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; text-align: left; width: 100%; }
.mini-book > .minw0 { flex: 1; display: flex; flex-direction: column; }
.mini-book.big { padding: 12px; }
.mini-book.spinning { opacity: .7; }
.suggest { display: flex; gap: 11px; align-items: flex-start; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 11px; text-align: left; width: 100%; }

.empty { text-align: center; color: var(--soft); padding: 34px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; font-size: 14px; }
.empty p { max-width: 34ch; }
.sm-empty { padding: 20px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }

/* library card (the one paper object in the app) */
.lcard { background: var(--card-paper); color: var(--card-text); border-radius: 6px; padding: 16px 16px 12px; box-shadow: 0 14px 34px #00000070; position: relative;
  background-image: linear-gradient(90deg, transparent 0 22px, #C9505F33 22px 23px, transparent 23px); }
.lcard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-left: 14px; border-bottom: 2px solid var(--card-ink); padding-bottom: 6px; }
.lcard-brand { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 20px; color: var(--card-ink); }
.lcard-no { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.lcard-rule { font-size: 11px; padding: 6px 0 0 14px; color: #8A6A6C; }
.lcard-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; padding-left: 14px; margin-top: 4px; }
.lcard-slot { position: relative; height: 56px; border-bottom: 1px solid var(--card-rule); display: flex; align-items: center; justify-content: center; }
.lcard-slot-no { position: absolute; left: 0; top: 5px; font-family: var(--f-mono); font-size: 9px; color: #A88A8C; }
.lstamp { display: inline-flex; flex-direction: column; align-items: center; border: 2px solid var(--card-ink); outline: 1px solid var(--card-ink); outline-offset: 2px; border-radius: 3px; padding: 2px 7px 3px; color: var(--card-ink); transform: rotate(var(--tilt)); opacity: .88; font-family: var(--f-mono); text-transform: uppercase; line-height: 1.15; mix-blend-mode: multiply; }
.lstamp-top { font-size: 8.5px; letter-spacing: .12em; font-weight: 500; }
.lstamp-date { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; }
.lstamp-in { animation: thunk .6s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes thunk { 0% { opacity: 0; transform: rotate(var(--tilt)) scale(2.2); } 60% { opacity: .95; transform: rotate(var(--tilt)) scale(.94); } 100% { opacity: .88; transform: rotate(var(--tilt)) scale(1); } }
.lcard-sm { padding: 12px 12px 8px; }
.lcard-sm .lcard-slot { height: 46px; }
.lcard-sm .lstamp-date { font-size: 10.5px; }

.reward { background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.reward .btn-primary { background: var(--paper); color: var(--accent-deep); align-self: flex-start; }
.reward .label { color: #FFFFFFCC; }
.reward .input { background: #00000033; border-color: #FFFFFF44; }

.popup { position: fixed; inset: 0; z-index: 80; background: #0A0507E6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); animation: fade .3s ease; transition: opacity .35s ease; }
.popup-out { opacity: 0; }
.popup-card { width: 100%; max-width: 330px; animation: drop .45s cubic-bezier(.16, 1, .3, 1); }
@keyframes drop { from { transform: translateY(30px) rotate(-3deg) scale(.94); opacity: 0; } }
.popup-text { min-height: 56px; text-align: center; color: #EAD8DC; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.popup-big { font-family: var(--f-display); font-size: 26px; font-weight: 700; color: var(--paper); }
.popup-x { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); background: transparent; }

/* chrome */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: space-around; background: #1B1015F2; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.nav-btn { position: relative; flex: 1; max-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--soft); font-size: 10.5px; font-weight: 600; padding: 8px 0; }
.nav-btn.on { color: var(--paper); }
.nav-btn.on svg { color: var(--accent-hi); }
.nav-dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 99px; background: var(--accent-hi); }
.nav-add { width: 52px; height: 52px; border-radius: 18px; background: var(--accent); color: #fff; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px #B0263D55; flex-shrink: 0; margin: 0 4px; }
.nav-add:active { transform: scale(.95); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--paper); color: var(--accent-deep); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 12px; box-shadow: 0 10px 30px #00000080; max-width: calc(100% - 32px); animation: rise .25s ease; }
.toast-err { background: #3A1A16; color: var(--err); border: 1px solid #FF6B5E55; }
.banner-err, .banner-local { max-width: 640px; margin: 12px auto 0; font-size: 12.5px; padding: 8px 12px; border-radius: 10px; display: flex; gap: 6px; align-items: center; }
.banner-err { background: #FF6B5E1A; color: var(--err); }
.banner-local { color: var(--soft); border: 1px solid var(--line); }
.loading { min-height: 50vh; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: var(--soft); }

@media (max-width: 370px) {
  .tiles.three { grid-template-columns: repeat(2, 1fr); }
  .tiles.three .tile:last-child { grid-column: span 2; }
  .brand { font-size: 30px; }
  .goal { gap: 14px; padding: 14px; }
}

/* standalone extras */
img { max-width: 100%; }
[hidden] { display: none !important; }
.install { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 12px 12px 14px; color: var(--accent-hi); margin-bottom: 16px; }
.install strong { color: var(--text); font-size: 14px; }
.install .sm { color: var(--soft); }
.scan-cta { display: flex; align-items: center; gap: 14px; text-align: left; background: linear-gradient(150deg, var(--accent), var(--accent-deep)); color: #fff; border: none; border-radius: 16px; padding: 18px; }
.scan-cta span { display: flex; flex-direction: column; gap: 2px; }
.scan-cta strong { font-size: 16px; }
.scan-cta small { font-size: 12.5px; color: #FFFFFFCC; }
.scan-cta:disabled { opacity: .6; }
.results { display: flex; flex-direction: column; gap: 8px; }
.result { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; color: var(--soft); }
.scanner { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; flex-direction: column; }
.scanner-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #fff; font-weight: 600; font-size: 15px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.scanner-view { position: relative; flex: 1; overflow: hidden; }
.scanner-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanner-frame { position: absolute; left: 10%; right: 10%; top: 38%; height: 22%; border: 2.5px solid var(--accent-hi); border-radius: 14px; box-shadow: 0 0 0 100vmax #00000077; overflow: hidden; }
.scanner-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--accent-hi); box-shadow: 0 0 10px var(--accent-hi); animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { transform: translateY(-34px); } to { transform: translateY(34px); } }
.scanner-hint { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); text-align: center; color: #fff; font-size: 14px; justify-content: center; }
.scanner-err { flex: 1; justify-content: center; color: #fff; padding: 24px; }
